[project]
name = "tp4-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fatimaezzahra-max", email = "fatimaezzahraamarzoug@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
tp4-rag = "tp4_rag:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
